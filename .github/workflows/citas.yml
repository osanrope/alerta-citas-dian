name: Revisar citas DIAN

on:
  schedule:
    # Respaldo por si falla el despertador de cron-job.org (hora UTC)
    - cron: "*/15 11-23,0-3 * * *"
  workflow_dispatch:
    inputs:
      probar_llamada:
        description: "Solo hacer una llamada de prueba"
        type: boolean
        default: false

# Nunca corren dos revisiones al tiempo: así la memoria no se pisa
concurrency:
  group: revisar-citas-${{ inputs.probar_llamada && 'prueba' || 'normal' }}
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        timeout-minutes: 3
        run: |
          pip install playwright requests
          python -m playwright install chromium --only-shell

      - name: Recuperar memoria de la revisión anterior
        uses: actions/cache/restore@v4
        with:
          path: estado.json
          key: estado-${{ github.run_id }}
          restore-keys: estado-

      - name: Revisar disponibilidad
        timeout-minutes: 3
        run: python check_citas.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_USER: ${{ secrets.TELEGRAM_USER }}
          PROBAR_LLAMADA: ${{ inputs.probar_llamada }}
          # "1" = avisa también cuando NO hay citas (modo prueba)
          AVISAR_SIEMPRE: "0"
          LLAMADAS: "0"            # "1" = también hacer llamada de Telegram
          LATIDO_MIN: "1"          # mensaje "sigo revisando" cada 5 minutos
          RECORDATORIO_MIN: "1"    # recordatorio cada minuto mientras haya citas
          LLAMADA_CADA_MIN: "15"   # (solo si LLAMADAS es "1")
          MAX_LLAMADAS: "3"        # (solo si LLAMADAS es "1")

      - name: Guardar memoria para la próxima revisión
        if: always() && hashFiles('estado.json') != ''
        uses: actions/cache/save@v4
        with:
          path: estado.json
          key: estado-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Guardar capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: "*.png"
          if-no-files-found: ignore

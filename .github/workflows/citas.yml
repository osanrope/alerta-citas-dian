name: Revisar citas DIAN

on:
  schedule:
    # Cada 15 min entre 6:00 a. m. y 10:59 p. m. hora Colombia (cron va en UTC)
    - cron: "*/15 11-23,0-3 * * *"
  workflow_dispatch: # botón "Run workflow" para probar a mano

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install playwright requests
          python -m playwright install --with-deps chromium

      - name: Revisar disponibilidad
        run: python check_citas.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Modo prueba: "1" = avisa también cuando NO hay citas.
          # Cuando termines de probar, cámbialo a "0".
          AVISAR_SIEMPRE: "1"

      - name: Guardar capturas si algo falló
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: "*.png"
          if-no-files-found: ignore
